<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route — operating console to May 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;--surface:#f5f7fa;--surface-2:#eef1f6;--ink:#0f1b33;--ink-2:#5b6679;--ink-3:#8b94a7;--line:#e5e9f0;
  --job:#3a5bff;--job-soft:#eaefff;--body:#178a5c;--body-soft:#e6f5ee;--money:#6e5ad6;--money-soft:#efecfb;--alert:#b9650a;--alert-soft:#fff3e2;--ok:#178a5c;
  --radius:12px;--shadow:0 1px 2px rgba(15,27,51,.06),0 4px 16px rgba(15,27,51,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1422;--surface:#141b2b;--surface-2:#1b2335;--ink:#e9edf5;--ink-2:#b2bbcb;--ink-3:#7f8aa0;--line:#26304a;
  --job:#7b93ff;--job-soft:#1a2347;--body:#3fc78b;--body-soft:#12302a;--money:#ab9ef2;--money-soft:#241f3d;--alert:#f0a94a;--alert-soft:#3a2a12;--ok:#3fc78b;
  --shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0e1422;--surface:#141b2b;--surface-2:#1b2335;--ink:#e9edf5;--ink-2:#b2bbcb;--ink-3:#7f8aa0;--line:#26304a;
  --job:#7b93ff;--job-soft:#1a2347;--body:#3fc78b;--body-soft:#12302a;--money:#ab9ef2;--money-soft:#241f3d;--alert:#f0a94a;--alert-soft:#3a2a12;--ok:#3fc78b;
  --shadow:none;color-scheme:dark;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--job);}
h1,h2,h3,h4{margin:0;letter-spacing:-0.01em;}
h1{font-size:22px;font-weight:700;}
h2{font-size:18px;font-weight:700;}
h3{font-size:15px;font-weight:600;}
p{margin:0;}
.muted{color:var(--ink-2);} .faint{color:var(--ink-3);} .sm{font-size:14px;} .xs{font-size:12.5px;}
:focus-visible{outline:2px solid var(--job);outline-offset:2px;border-radius:6px;}

/* Shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%;}
.side{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--paper);}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center;}
.brand .mark svg{width:16px;height:16px;stroke:var(--paper);}
.brand b{font-size:15px;}
.brand small{display:block;color:var(--ink-3);font-size:12px;}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14.5px;min-height:44px;}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.nav a:hover{background:var(--surface);}
.nav a.on{background:var(--job-soft);color:var(--job);}
.nav .sep{height:1px;background:var(--line);margin:10px 8px;}
.main{min-width:0;padding:22px 26px 100px;max-width:1040px;}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.top p{margin-top:2px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);}
.pill.job{background:var(--job-soft);color:var(--job);} .pill.body{background:var(--body-soft);color:var(--body);} .pill.money{background:var(--money-soft);color:var(--money);} .pill.alert{background:var(--alert-soft);color:var(--alert);}

/* Bottom nav (mobile) */
.bnav{display:none;}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;}
  .side{display:none;}
  .main{padding:16px 16px 96px;}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--ink-3);font-size:11px;font-weight:500;min-height:44px;border-radius:8px;}
  .bnav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .bnav a.on{color:var(--job);}
}

/* Cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
.grid{display:grid;gap:12px;}
.g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
@media (max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr 1fr;}}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr;} .g4{grid-template-columns:1fr 1fr;} .stat b{font-size:20px;}}
.stat small{display:block;color:var(--ink-3);font-size:12.5px;}
.stat b{font-size:22px;font-weight:700;letter-spacing:-0.02em;}
.stat .sub{font-size:13px;color:var(--ink-2);margin-top:2px;}
.card.job{border-top:3px solid var(--job);} .card.body{border-top:3px solid var(--body);} .card.money{border-top:3px solid var(--money);} .card.mind{border-top:3px solid var(--alert);}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px;}
.section-title h2{font-size:16px;}

/* Checklist rows */
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
.row:first-of-type{border-top:0;padding-top:4px;}
.row .chk{flex:none;width:24px;height:24px;margin-top:1px;border:2px solid var(--line);border-radius:7px;background:var(--paper);display:grid;place-items:center;}
.row .chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.row.done .chk{background:var(--ok);border-color:var(--ok);} .row.done .chk svg{opacity:1;}
.row.done .t{color:var(--ink-3);text-decoration:line-through;}
.row .t{font-weight:500;} .row .d{font-size:13.5px;color:var(--ink-2);margin-top:2px;}
.row .meta{font-size:12px;color:var(--ink-3);margin-top:3px;}
.row button.tap{all:unset;cursor:pointer;display:flex;gap:12px;flex:1;align-items:flex-start;min-height:44px;}
.row .tag{flex:none;align-self:center;}

/* Buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14.5px;}
.btn:hover{background:var(--surface);} a.btn{text-decoration:none;}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);} .btn.primary:hover{opacity:.9;}
.btn.job{background:var(--job);border-color:var(--job);color:#fff;} .btn.body{background:var(--body);border-color:var(--body);color:#fff;}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);}
textarea.in{min-height:88px;resize:vertical;}
.frow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:560px){.frow{grid-template-columns:1fr 1fr;}}
.help{font-size:12.5px;color:var(--ink-3);margin-top:4px;}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:30;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (min-width:821px){.toast{bottom:28px;}}

/* Accordion */
details.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow);}
details.acc + details.acc{margin-top:10px;}
details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;font-weight:600;min-height:52px;}
details.acc summary::-webkit-details-marker{display:none;}
details.acc summary .chev{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s;flex:none;}
details.acc[open] summary .chev{transform:rotate(180deg);}
details.acc .body{padding:0 16px 16px;color:var(--ink);font-size:15px;}
details.acc .body p{margin-top:8px;max-width:72ch;}
details.acc .body ul,details.acc .body ol{margin:8px 0 0;padding-left:20px;max-width:72ch;} details.acc .body li{margin:5px 0;}
.rule{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--surface);}
.rule .if{font-weight:600;} .rule .if::before{content:"If ";color:var(--alert);} .rule .then{margin-top:3px;} .rule .then::before{content:"then ";color:var(--alert);font-weight:600;}
.rule .why{font-size:13px;color:var(--ink-2);margin-top:6px;}
.script{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14.5px;position:relative;}
.script .lab{font-size:12px;color:var(--ink-3);margin-bottom:4px;font-weight:600;}
.script .cp{position:absolute;top:8px;right:8px;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-size:12px;color:var(--ink-3);font-weight:600;background:var(--surface);}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.search{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.search .in{flex:1;}
.empty{color:var(--ink-3);font-size:14px;padding:16px 0;text-align:center;}
.kg{font-weight:700;color:var(--body);}
.tl{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.tl .ph{background:var(--surface);padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--job);border-top:1px solid var(--line);}
.tl .ph:first-child{border-top:0;}
.tl .row{padding:12px 14px;margin:0;border-top:1px solid var(--line);}
.tl .row.hide{display:none;}
.verdict{border-left:3px solid var(--alert);background:var(--alert-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin-top:12px;font-size:14.5px;}
.verdict.ok{border-color:var(--ok);background:var(--body-soft);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{all:unset;cursor:pointer;padding:0 14px;min-height:40px;font-size:13.5px;font-weight:600;color:var(--ink-2);}
.seg button.on{background:var(--ink);color:var(--paper);}
.chart{width:100%;height:auto;display:block;margin-top:8px;}
.sheet-bg{position:fixed;inset:0;background:rgba(15,27,51,.4);z-index:40;display:none;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:41;display:none;}
.sheet a{display:flex;align-items:center;gap:12px;padding:12px 8px;min-height:48px;text-decoration:none;color:var(--ink);font-weight:500;border-top:1px solid var(--line);}
.sheet a:first-of-type{border-top:0;}
.sheet a svg{width:20px;height:20px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.sheet-bg.open,.sheet.open{display:block;}
.view{display:none;} .view.on{display:block;}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:5px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
.quick{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:8px;margin-top:12px;}
@media (max-width:820px){
  .seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%;}
  .seg button{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 6px;text-align:center;}
  .quick{grid-template-columns:repeat(3,1fr);}
  .quick .btn{padding:0 8px;font-size:14px;}
  .top{margin-bottom:12px;}
  h1{font-size:20px;}
  .card{padding:14px;}
  details.acc .body{font-size:15px;}
}
@media (pointer:coarse){.btn.sm{min-height:44px;} .row button.tap{min-height:48px;}}
@media (max-width:640px){
  .tw{overflow:visible;}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%;}
  table.stack tr:first-child{display:none;}
  table.stack tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;background:var(--paper);}
  table.stack td{border:0;padding:3px 0;}
  table.stack td[data-label]:not([data-label=""])::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:1px;}
  table.stack td select.in{width:100%;}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 L10 6 L14 14 L20 4"/></svg></div><div><b>Route</b><small>to May 2027</small></div></div>
    <nav class="nav" id="sideNav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================ ICONS ============================ */
const I = {
  today:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  week:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16M15 4v16"/></svg>',
  log:'<svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/></svg>',
  rules:'<svg viewBox="0 0 24 24"><path d="M12 3l9 4-9 4-9-4 9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  job:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>',
  body:'<svg viewBox="0 0 24 24"><path d="M3 12h3l2-5 3 10 3-7 2 2h5"/></svg>',
  money:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M3 10h2M19 14h2"/></svg>',
  checks:'<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>',
  sources:'<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V5a2 2 0 0 1 2-2h14v14H6.5A2.5 2.5 0 0 0 4 19.5z"/></svg>',
  res:'<svg viewBox="0 0 24 24"><path d="M2 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  setup:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

/* ============================ STORE ============================ */
const KEY='route-console-v1';
const DEFAULTS={ setup:{slotWeekdayTime:'',slotWeekdayPlace:'',slotTueThuTime:'',slotWeekendDay:'Sat',slotWeekendTime:'',audio:'',noticePeriod:'',freeMeal:''},
  daily:{}, weeks:{}, checkins:[], problems:{}, pitches:[], apps:[], lifts:[], checkpoints:{}, passes:{} };
let S;
function load(){ try{ const raw=localStorage.getItem(KEY); S=raw?Object.assign({},DEFAULTS,JSON.parse(raw)):JSON.parse(JSON.stringify(DEFAULTS)); }catch(e){ S=JSON.parse(JSON.stringify(DEFAULTS)); } for(const k in DEFAULTS){ if(S[k]===undefined) S[k]=JSON.parse(JSON.stringify(DEFAULTS[k])); } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('Could not save (storage unavailable)'); } }

/* ============================ DATES ============================ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const dayMs=86400000;
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/dayMs);
function weekStart(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }
const WK=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{const d=parse(s);return `${WK[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;};
const fmtLong=d=>`${WK[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;

const OFFER='2027-04-30', BUFFER='2027-05-15', LAND='2027-05-31', START='2026-11-17';
const PHASES=[
  {n:1,name:'Become legible',from:'2026-11-17',to:'2026-12-31',goal:'Résumé, two repos, 25 problems, 6 pitches, mini-rag done. Rules installed.'},
  {n:2,name:'Loop readiness',from:'2027-01-01',to:'2027-01-31',goal:'4 designs spoken, 5 stories, 40 problems, calibration applications, screen rate known.'},
  {n:3,name:'Volume',from:'2027-02-01',to:'2027-02-28',goal:'50+ applications, referral-first; 5+ first rounds; mediums at ~50%.'},
  {n:4,name:'Convert',from:'2027-03-01',to:'2027-03-31',goal:'2+ final rounds. Sleep protected in interview weeks.'},
  {n:5,name:'Close',from:'2027-04-01',to:'2027-04-30',goal:'Offer ≥ ₹12 LPA signed, in writing.'},
  {n:6,name:'Transition',from:'2027-05-01',to:'2027-05-31',goal:'Serving notice or joined. 68 kg. Money sequence starts.'}
];
function phaseFor(d){ const s=iso(d); return PHASES.find(p=>s>=p.from&&s<=p.to)||(s<START?PHASES[0]:PHASES[5]); }

function verdictHTML(){
  const c=S.checkins; if(c.length<1) return '';
  const last=c[c.length-1], prev=c[c.length-2], prev2=c[c.length-3];
  const out=[];

  if(prev){
    const drop=prev.weight-last.weight;
    if(c.length>2&&drop>0.7) out.push(['alert','Dropping faster than 0.7 kg/week. Add the carb back at one meal.']);
    else if(prev2&&Math.abs(prev.weight-last.weight)<=0.1&&Math.abs(prev2.weight-prev.weight)<=0.1){ if(last.sleep<3) out.push(['alert','Flat two weeks with sleep in place: remove one roti or half the rice from one carb meal. If this is the third flat week, walk six days for two weeks instead.']); }
    else if(drop>=0.1) out.push(['ok','On the line. Nothing changes.']);
    else if(last.sleep<3) out.push(['ok','Up or flat one week only. Ignore; only two-week trends trigger changes.']);

  return out.map(o=>`<div class="verdict ${o[0]==='ok'?'ok':''}">${o[1]}</div>`).join('');
}

  const grid=[76,74,72,70,68].map(w=>`<line x1="${L}" x2="${W-R}" y1="${ys(w)}" y2="${ys(w)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(w)+4}" font-size="10" text-anchor="end" fill="var(--ink-3)">${w}</text>`).join('');
  const months=['2026-12-01','2027-01-01','2027-02-01','2027-03-01','2027-04-01','2027-05-01'].map(m=>`<text x="${xs(m)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--ink-3)">${MONTHS[parse(m).getMonth()]}</text>`).join('');
  const tx=xs(iso(today())); const todayLine=tx>L&&tx<W-R?`<line x1="${tx}" x2="${tx}" y1="${T}" y2="${H-B}" stroke="var(--alert)" stroke-dasharray="3 3"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight readings against the target line">${grid}${months}${todayLine}<path d="${line}" fill="none" stroke="var(--body)" stroke-width="2"/>${pl}${pts}</svg>`;
}

function vRules(){

  ${acc('Intentions don’t move behaviour; if-then plans do','<p>Goal intentions alone translate into action about half the time. Writing the behaviour as “if X, then Y” improved goal attainment by a medium-to-large effect (d ≈ 0.65) across 94 studies, confirmed in a 2024 update over 642 tests. Largest where plans usually die: getting started, and protecting an activity from interruption.</p><p class="sm muted">Applied: every rule here is an if-then; the week has fixed cues so behaviour fires on the cue, not on mood.</p>')}
  ${acc('A habit takes about two months; one miss costs nothing','<p>Median 66 days to automaticity (range 18–254). Missing a single day did not change the trajectory. The danger zone is roughly day 20–50: for you, 7 December to 6 January, through the holidays.</p><p class="sm muted">Applied: never miss twice; the holiday rule is pre-written.</p>')}
  ${acc('Same cue, same place, same time','<p>Stable context predicts faster habit formation; arbitrary timing slows it regardless of how often the box is ticked.</p><p class="sm muted">Applied: slot times are set once in Setup and never moved.</p>')}
  ${acc('Fresh starts help; “what the hell” kills','<p>Effort rises at the start of a cycle (a Monday, a month). The opposite force: one small failure read as “I already blew it” collapses the whole routine. The supported fix is planned slack.</p><p class="sm muted">Applied: two passes a month per area, written before the month starts; every Monday and 1st is a scripted reset.</p>')}
  ${acc('Pair the thing you avoid with the thing you want','<p>Locking audiobooks to the gym raised attendance by about 55% in a controlled study.</p><p class="sm muted">Applied: treadmill-only audio; one weekend pleasure only after the application block.</p>')}
  ${acc('Don’t visualise the offer; contrast it with the obstacle','<p>Vivid positive fantasies predicted less effort and worse outcomes (lower starting salaries, less weight lost). Mental contrasting plus an if-then plan (WOOP) has a small-to-moderate, reliable effect.</p><p class="sm muted">Applied: one 5-minute WOOP at the start of each phase. No vision boards.</p>')}
  ${acc('Learning that sticks: retrieve, space, interleave','<p>Testing yourself beats re-reading (g ≈ 0.50–0.70). Spreading practice beats cramming (g ≈ 0.74). Mixing categories after you know them beats blocking (g ≈ 0.42).</p><p class="sm muted">Applied: every problem is re-solved from memory a week later; designs are spoken, not read; categories are blocked for four weeks, then mixed.</p>')}

function protocolsHTML(q){
  q=q.trim().toLowerCase();
  const list=PROTOCOLS.filter(p=>!q||(p.s+' '+p.p+' '+p.tags).toLowerCase().includes(q));
  if(!list.length) return '<div class="empty">No rule matches. Try a shorter word.</div>';
  return list.map(p=>`<div class="rule"><div class="if">${esc(p.s)},</div><div class="then">${esc(p.p)}</div></div>`).join('');
}

    ['Chip Huyen — “AI Engineering” (book)','Low cost (₹600–1,200 paperback / ebook)','The one paid thing worth buying: evals, RAG, agents, serving, in the language interviewers use. Chapters 3–4 and 6–9 only.','https://huyenchip.com/books/'],

function vResources(){
  return `<div class="top"><div><h1>Resources</h1><p class="muted">Free first. Each one is tied to a slot so you never choose what to study. Rule: one resource per build artefact, one talk per design — collecting resources is not a slot.</p></div></div>`+
  RESOURCES.map((r,i)=>acc(r.slot,`<div class="tw"><table><tr><th>Resource</th><th>Cost</th><th>Use it for</th></tr>${r.items.map(it=>`<tr><td><a href="${esc(it[3])}" ${it[3].startsWith('#')?'':'target="_blank" rel="noopener"'}>${esc(it[0])}</a></td><td class="sm">${esc(it[1])}</td><td class="sm">${esc(it[2])}</td></tr>`).join('')}</table></div>`,i<2)).join('')+
  `<div class="card" style="margin-top:12px">${rule('you find a new course, book or playlist,','write it here in Backup notes and keep using the one you are on. Switching resources is the most common way a 150-hour budget disappears.')}</div>`;
}

/* ============================ WIRING ============================ */
function wire(m){
  m.querySelectorAll('table').forEach(t=>{const hs=[...t.querySelectorAll('tr:first-child th')].map(th=>th.textContent.trim()); if(!hs.length) return; t.classList.add('stack'); t.querySelectorAll('tr').forEach(tr=>[...tr.children].forEach((c,i)=>{if(c.tagName==='TD') c.setAttribute('data-label',hs[i]||'');}));});
  m.querySelectorAll('[data-chk] .tap').forEach(b=>b.addEventListener('click',()=>{
    const id=b.closest('[data-chk]').dataset.chk; const [type,key]=[id.slice(0,2),id.slice(2)];
    if(type==='d:'){const r=dayRec(today()); r[key]=!r[key];}
    else if(type==='c:'){S.checkpoints[key]=!S.checkpoints[key];}
    else if(type==='p:'){const p=S.problems[key]||{}; if(p.date){delete S.problems[key];} else {S.problems[key]={date:iso(today())}; wk(today()).problems++; toast('Logged — re-solve due in a week');} }
    save(); refresh();
  }));
  m.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.resolve; if(S.problems[k]){S.problems[k].resolved=iso(today()); save(); toast('Re-solve logged'); refresh();}}));
  m.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>{const w=wk(today()); const k=b.dataset.inc; w[k]++; if(k==='pitches') S.pitches.push({date:iso(today()),subject:'Quick add',len:3,checks:0}); if(k==='apps') S.apps.push({date:iso(today()),company:'Quick add',role:'',channel:'Other',stage:'Applied',contact:'',next:''}); save(); toast('+1'); refresh();}));
  m.querySelectorAll('[data-pass]').forEach(b=>b.addEventListener('click',()=>{const p=passes(today()); const k=b.dataset.pass; if(p[k]>=2){toast('No passes left this month');return;} p[k]++; save(); toast('Pass used'); refresh();}));
  m.querySelectorAll('[data-sub]').forEach(b=>b.addEventListener('click',()=>{LOGSUB=b.dataset.sub; render('log');}));
  m.querySelectorAll('[data-cf]').forEach(b=>b.addEventListener('click',()=>{CHKF=b.dataset.cf; render('checks');}));
  m.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copyText(SCRIPTS[+b.dataset.copy].t)));
  m.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.theme; if(v==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); try{localStorage.setItem(KEY+'-theme',v);}catch(e){} }));
  const rq=m.querySelector('#rq'); if(rq) rq.addEventListener('input',()=>{m.querySelector('#rlist').innerHTML=protocolsHTML(rq.value);});
  const ciSave=m.querySelector('#ciSave'); if(ciSave) ciSave.addEventListener('click',()=>{
    const w=parseFloat(m.querySelector('#ciW').value); if(!(w>30&&w<200)){toast('Enter the scale reading');m.querySelector('#ciW').focus();return;}
    const rec={date:m.querySelector('#ciD').value||iso(today()),weight:+w.toFixed(1),sleep:+m.querySelector('#ciS').value||0,problems:+m.querySelector('#ciP').value||0,pitches:+m.querySelector('#ciR').value||0,apps:+m.querySelector('#ciA').value||0,note:m.querySelector('#ciN').value.trim()};
    const i=S.checkins.findIndex(c=>c.date===rec.date); if(i>=0) S.checkins[i]=rec; else S.checkins.push(rec); S.checkins.sort((a,b)=>a.date<b.date?-1:1);
    const wrec=wk(parse(rec.date)); wrec.problems=rec.problems; wrec.pitches=rec.pitches; wrec.apps=rec.apps;
    save(); toast('Check-in saved'); refresh();
  });
  const ciCopy=m.querySelector('#ciCopy'); if(ciCopy) ciCopy.addEventListener('click',()=>{const t=`problems: ${m.querySelector('#ciP').value||0} · pitches: ${m.querySelector('#ciR').value||0} · applications: ${m.querySelector('#ciA').value||0} · scale: ${m.querySelector('#ciW').value||'—'}`+(m.querySelector('#ciN').value.trim()?`\n${m.querySelector('#ciN').value.trim()}`:''); copyText(t);});
  m.querySelectorAll('[data-delci]').forEach(b=>b.addEventListener('click',()=>{S.checkins.splice(+b.dataset.delci,1); save(); refresh();}));
  const pSave=m.querySelector('#pSave'); if(pSave) pSave.addEventListener('click',()=>{const checks=m.querySelectorAll('.pc:checked').length; const d=m.querySelector('#pD').value||iso(today()); S.pitches.push({date:d,subject:m.querySelector('#pS').value,len:+m.querySelector('#pL').value||3,checks}); wk(parse(d)).pitches++; save(); toast('Pitch logged'); refresh();});
  const aSave=m.querySelector('#aSave'); if(aSave) aSave.addEventListener('click',()=>{const c=m.querySelector('#aC').value.trim(); if(!c){toast('Company is required');return;} const d=m.querySelector('#aD').value||iso(today()); S.apps.push({date:d,company:c,role:m.querySelector('#aR').value.trim(),channel:m.querySelector('#aCh').value,stage:'Applied',contact:m.querySelector('#aCt').value.trim(),next:m.querySelector('#aN').value.trim()}); wk(parse(d)).apps++; save(); toast('Added'); refresh();});
  m.querySelectorAll('[data-stage]').forEach(s=>s.addEventListener('change',()=>{S.apps[+s.dataset.stage].stage=s.value; save(); refresh();}));
  m.querySelectorAll('[data-delapp]').forEach(b=>b.addEventListener('click',()=>{S.apps.splice(+b.dataset.delapp,1); save(); refresh();}));
  const lSave=m.querySelector('#lSave'); if(lSave) lSave.addEventListener('click',()=>{const w=+m.querySelector('#lW').value, r=+m.querySelector('#lR').value; if(!(w>0&&r>0)){toast('Weight and reps');return;} S.lifts.push({date:iso(today()),lift:m.querySelector('#lL').value,w,r}); save(); toast('Logged'); refresh();});
  const sSave=m.querySelector('#sSave'); if(sSave) sSave.addEventListener('click',()=>{S.setup={slotWeekdayTime:m.querySelector('#sWT').value,slotWeekdayPlace:m.querySelector('#sWP').value.trim(),slotTueThuTime:m.querySelector('#sTT').value,slotWeekendDay:m.querySelector('#sWD').value,slotWeekendTime:m.querySelector('#sWTm').value,audio:m.querySelector('#sAu').value.trim(),noticePeriod:m.querySelector('#sNP').value.trim(),freeMeal:m.querySelector('#sFM').value.trim()}; save(); toast('Saved'); });
  const bkCopy=m.querySelector('#bkCopy'); if(bkCopy) bkCopy.addEventListener('click',()=>copyText(m.querySelector('#bk').value));
  const bkRestore=m.querySelector('#bkRestore'); if(bkRestore) bkRestore.addEventListener('click',()=>{try{const o=JSON.parse(m.querySelector('#bk').value); if(!o||typeof o!=='object') throw 0; S=Object.assign({},DEFAULTS,o); save(); toast('Restored'); refresh();}catch(e){toast('That box does not contain a valid backup');}});
  const bkReset=m.querySelector('#bkReset'); if(bkReset) bkReset.addEventListener('click',()=>{if(confirm('Delete everything saved in this browser?')){S=JSON.parse(JSON.stringify(DEFAULTS)); save(); refresh();}});
}
function copyText(t){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>fallbackCopy(t));} else fallbackCopy(t); }
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Copied');}catch(e){toast('Select and copy manually');} document.body.removeChild(ta); }

/* ============================ BOOT ============================ */
load();
try{const th=localStorage.getItem(KEY+'-theme'); if(th&&th!=='auto') document.documentElement.setAttribute('data-theme',th);}catch(e){}
route();
</script>
