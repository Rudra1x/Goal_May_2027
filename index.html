<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<title>Route planner — 17 Nov 2026 to 31 May 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;--surface:#f5f7fa;--surface-2:#eef1f6;--ink:#0f1b33;--ink-2:#55607a;--ink-3:#8790a5;--line:#e4e8ef;
  --accent:#3a5bff;--accent-soft:#eaefff;--ok:#16895b;--ok-soft:#e5f5ee;--warn:#b7680b;--warn-soft:#fff3e2;--bad:#d03a3a;--bad-soft:#fdecec;
  --radius:12px;--shadow:0 1px 2px rgba(15,27,51,.05),0 4px 14px rgba(15,27,51,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1320;--surface:#141b2a;--surface-2:#1b2335;--ink:#e9edf5;--ink-2:#b0b9ca;--ink-3:#7c879d;--line:#252f47;
  --accent:#7b93ff;--accent-soft:#1a2347;--ok:#3fc78b;--ok-soft:#12302a;--warn:#f0a94a;--warn-soft:#3a2a12;--bad:#f07272;--bad-soft:#3a1717;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0d1320;--surface:#141b2a;--surface-2:#1b2335;--ink:#e9edf5;--ink-2:#b0b9ca;--ink-3:#7c879d;--line:#252f47;
  --accent:#7b93ff;--accent-soft:#1a2347;--ok:#3fc78b;--ok-soft:#12302a;--warn:#f0a94a;--warn-soft:#3a2a12;--bad:#f07272;--bad-soft:#3a1717;--shadow:none;color-scheme:dark;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--accent);}
h1,h2,h3,h4{margin:0;letter-spacing:-0.01em;}
h1{font-size:22px;font-weight:700;} h2{font-size:16px;font-weight:700;} h3{font-size:15px;font-weight:600;}
p{margin:0;}
.muted{color:var(--ink-2);} .faint{color:var(--ink-3);} .sm{font-size:14px;} .xs{font-size:12.5px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh;}
.side{border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--paper);}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center;}
.brand .mark svg{width:16px;height:16px;stroke:var(--paper);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.brand b{font-size:15px;} .brand small{display:block;color:var(--ink-3);font-size:12px;}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14.5px;min-height:42px;}
.nav a svg,.bnav a svg,.sheet a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.nav a:hover{background:var(--surface);} .nav a.on{background:var(--accent-soft);color:var(--accent);}
.nav .sep{height:1px;background:var(--line);margin:8px;}
.syncbadge{margin:14px 10px 0;font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;}
.syncbadge i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block;}
.syncbadge.ok i{background:var(--ok);} .syncbadge.err i{background:var(--bad);} .syncbadge.busy i{background:var(--warn);}
.main{min-width:0;padding:22px 26px 110px;max-width:980px;}
.bnav{display:none;}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;} .side{display:none;}
  .main{padding:14px 14px 100px;}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--ink-3);font-size:11px;font-weight:500;min-height:46px;border-radius:8px;}
  .bnav a svg{width:21px;height:21px;} .bnav a.on{color:var(--accent);}
  h1{font-size:20px;}
}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.top .sub{margin-top:2px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;}
.pill.ok{background:var(--ok-soft);color:var(--ok);} .pill.bad{background:var(--bad-soft);color:var(--bad);} .pill.warn{background:var(--warn-soft);color:var(--warn);} .pill.acc{background:var(--accent-soft);color:var(--accent);}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
.grid{display:grid;gap:12px;} .g2{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);} .g5{grid-template-columns:repeat(5,1fr);}
@media (max-width:820px){.g3,.g4,.g5{grid-template-columns:1fr 1fr;}}
@media (max-width:420px){.g2.stack1{grid-template-columns:1fr;}}
.stat small{display:block;color:var(--ink-3);font-size:12.5px;} .stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;} .stat .s{font-size:12.5px;color:var(--ink-2);}
.stat.bad b{color:var(--bad);} .stat.ok b{color:var(--ok);} .stat.acc b{color:var(--accent);}
.stat.link{cursor:pointer;} .stat.link:hover{border-color:var(--accent);}
.st{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px;}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;}
.bar i{display:block;height:100%;background:var(--ok);} .bar i.sk{background:var(--ink-3);opacity:.5;} .bar i.ov{background:var(--bad);}
.prow{display:grid;grid-template-columns:118px 1fr 56px;gap:10px;align-items:center;padding:7px 0;font-size:14px;}
.prow b{text-align:right;font-weight:600;font-size:13.5px;}
@media (max-width:420px){.prow{grid-template-columns:92px 1fr 48px;}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);}
.btn:hover{background:var(--surface);} .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);} .btn.acc{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;} .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
@media (pointer:coarse){.btn.sm{min-height:40px;}}
.datenav{display:flex;align-items:center;gap:6px;}
.datenav .btn{min-height:40px;width:40px;padding:0;} .datenav .btn.wide{width:auto;padding:0 12px;}
/* tasks */
.group{margin-top:14px;} .group h3{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:600;margin-bottom:6px;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;}
.task{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-top:8px;}
.task .cb{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;margin-top:1px;padding:0;}
.task .cb svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.task.done .cb{background:var(--ok);border-color:var(--ok);} .task.done .cb svg{opacity:1;}
.task.done .tt{color:var(--ink-3);text-decoration:line-through;}
.task.skip{opacity:.6;} .task.skip .tt{text-decoration:line-through;}
.task.over{border-color:var(--bad);background:var(--bad-soft);}
.task .tb{flex:1;min-width:0;}
.task .tt{font-weight:600;font-size:15px;line-height:1.35;}
.task .tm{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.task details{margin-top:6px;} .task details summary{font-size:13px;color:var(--accent);cursor:pointer;list-style:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;min-height:28px;}
.task details summary::-webkit-details-marker{display:none;}
.task details .hw{font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.5;}
.task details .hw a{font-weight:600;}
.task .side-btn{flex:none;align-self:center;}
.task .skb{border:1px solid var(--line);background:transparent;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-2);padding:0 9px;min-height:32px;}
@media (pointer:coarse){.task .skb{min-height:40px;} .task .cb{width:32px;height:32px;}}
.empty{color:var(--ink-3);font-size:14px;padding:16px 0;text-align:center;}
.banner{border-radius:10px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.banner.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad);} .banner.warn{background:var(--warn-soft);border:1px solid var(--warn);} .banner.ok{background:var(--ok-soft);border:1px solid var(--ok);}
/* week & month */
details.day{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);margin-top:10px;}
details.day > summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:50px;}
details.day > summary::-webkit-details-marker{display:none;}
details.day > summary .dn{font-weight:700;min-width:92px;} details.day > summary .bar{flex:1;}
details.day > summary .ct{font-size:13px;color:var(--ink-2);min-width:46px;text-align:right;}
details.day.today{border-color:var(--accent);} details.day .inner{padding:0 12px 12px;}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
@media (max-width:480px){.cal{gap:3px;} .cal button{font-size:13px;border-radius:8px;} .cal button small{font-size:9.5px;}}
.cal .h{font-size:11.5px;color:var(--ink-3);text-align:center;font-weight:600;}
.cal button{all:unset;box-sizing:border-box;min-width:0;cursor:pointer;aspect-ratio:1/1.05;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:600;background:var(--paper);}
.cal button small{font-size:10.5px;font-weight:600;}
.cal button.out{visibility:hidden;}
.cal button.full{background:var(--ok-soft);border-color:var(--ok);} .cal button.full small{color:var(--ok);}
.cal button.part{background:var(--warn-soft);border-color:var(--warn);} .cal button.part small{color:var(--warn);}
.cal button.miss{background:var(--bad-soft);border-color:var(--bad);} .cal button.miss small{color:var(--bad);}
.cal button.fut small{color:var(--ink-3);} .cal button.td{outline:2px solid var(--accent);outline-offset:1px;}
.cal button.ms::after{content:"";width:5px;height:5px;border-radius:50%;background:#ef4444;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px;} .legend span{display:inline-flex;gap:5px;align-items:center;} .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap;}
.seg button{all:unset;cursor:pointer;padding:0 13px;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--ink-2);}
.seg button.on{background:var(--ink);color:var(--paper);}
@media (max-width:820px){.seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%;} .seg.s6{grid-template-columns:repeat(6,1fr);} .seg button{min-height:44px;padding:0 4px;text-align:center;}}
.wkrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;} .wkrow:first-child{border-top:0;}
.wkrow .l{min-width:118px;font-weight:600;font-size:14px;} .wkrow .bar{flex:1;} .wkrow b{min-width:44px;text-align:right;font-size:13.5px;}
/* forms */
.fld{margin-top:12px;} .fl{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.fl label{font-size:13.5px;font-weight:600;color:var(--ink-2);}
.hint{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--accent);padding:0;display:grid;place-items:center;}
@media (pointer:coarse){.hint{width:30px;height:30px;}}
.hint[aria-expanded="true"]{background:var(--accent);color:#fff;border-color:var(--accent);}
.hb{background:var(--accent-soft);border-radius:8px;padding:9px 11px;font-size:13.5px;margin-bottom:8px;color:var(--ink);line-height:1.45;}
.hb b{font-weight:600;}
.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px;}
textarea.in{min-height:84px;resize:vertical;}
.frow{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px;}
@media (max-width:520px){.frow{grid-template-columns:1fr;}}
.auto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.auto div{background:var(--surface);border-radius:10px;padding:10px;text-align:center;} .auto b{display:block;font-size:20px;} .auto small{font-size:12px;color:var(--ink-3);}
.verdict{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin-top:10px;font-size:14.5px;} .verdict.ok{border-color:var(--ok);background:var(--ok-soft);}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;} th{font-size:12px;color:var(--ink-3);font-weight:600;background:var(--surface);}
.tw{overflow-x:auto;}
@media (max-width:640px){
  .tw{overflow:visible;}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%;}
  table.stack tr:first-child{display:none;}
  table.stack tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;}
  table.stack td{border:0;padding:3px 0;}
  table.stack td[data-label]:not([data-label=""])::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;}
}
details.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);margin-top:10px;}
details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;font-weight:600;min-height:50px;}
details.acc summary::-webkit-details-marker{display:none;}
details.acc summary svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none;transition:transform .15s;}
details.acc[open] summary svg{transform:rotate(180deg);}
details.acc .body{padding:0 16px 16px;font-size:15px;}
details.acc .body p{margin-top:8px;max-width:72ch;} details.acc .body ul,details.acc .body ol{margin:8px 0 0;padding-left:20px;} details.acc .body li{margin:5px 0;}
.rule{border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-top:10px;background:var(--surface);font-size:14.5px;}
.rule .if{font-weight:600;} .rule .if::before{content:"If ";color:var(--warn);} .rule .then{margin-top:3px;} .rule .then::before{content:"then ";color:var(--warn);font-weight:600;}
.rule .why{font-size:13px;color:var(--ink-2);margin-top:6px;}
.script{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14.5px;}
.script .lab{font-size:12px;color:var(--ink-3);margin-bottom:6px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.gl dt{font-weight:700;margin-top:12px;} .gl dd{margin:2px 0 0;color:var(--ink-2);font-size:14.5px;}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:50;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);} @media (min-width:821px){.toast{bottom:28px;}}
.sheet-bg{position:fixed;inset:0;background:rgba(15,27,51,.4);z-index:40;display:none;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:16px 16px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:41;display:none;max-height:80vh;overflow:auto;}
.sheet a{display:flex;align-items:center;gap:12px;padding:12px 8px;min-height:48px;text-decoration:none;color:var(--ink);font-weight:500;border-top:1px solid var(--line);}
.sheet a:first-child{border-top:0;}
.sheet-bg.open,.sheet.open{display:block;}
.chart{width:100%;height:auto;display:block;margin-top:8px;}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:5px;}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0 0;} .steps li{position:relative;padding-left:34px;margin:10px 0;font-size:14.5px;}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;display:grid;place-items:center;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M4 18 L10 6 L14 14 L20 4"/></svg></div><div><b>Route planner</b><small>17 Nov → 31 May</small></div></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="syncbadge" id="syncSide"><i></i><span>Sync off</span></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="bnav" id="bnav"></nav>

<script>
/* =================== ICONS =================== */
const I={
 today:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

 phase:'<svg viewBox="0 0 24 24"><path d="M4 19 L10 7 L14 14 L20 5"/><circle cx="4" cy="19" r="1.5"/><circle cx="20" cy="5" r="1.5"/></svg>',
 dash:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 log:'<svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>',

const _isoFmt=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const _timeFmt=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
function TODAY(){return _isoFmt.format(new Date(Date.now()+OFFSET));}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const weekMon=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};
const WK=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt=s=>{const d=parse(s);return `${WK[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;};
const fmtL=s=>{const d=parse(s);return `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]}, ${d.getDate()} ${MONL[d.getMonth()]} ${d.getFullYear()}`;};
function fetchT(u,ms=4500){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal,cache:'no-store'}).finally(()=>clearTimeout(t));}
async function fetchTime(){
  const tries=[
    async()=>{const j=await (await fetchT('https://timeapi.io/api/time/current/zone?timeZone=Asia%2FKolkata')).json();return Date.parse(String(j.dateTime).slice(0,19)+'+05:30');},
    async()=>{const j=await (await fetchT('https://worldtimeapi.org/api/timezone/Asia/Kolkata')).json();return j.unixtime*1000;}
  ];
  for(const t of tries){try{const ms=await t(); if(ms&&!isNaN(ms)){OFFSET=Math.abs(ms-Date.now())<2000?0:ms-Date.now(); TIMESRC='internet time'; afterDayCheck(); return;}}catch(e){}}
  TIMESRC='device clock'; afterDayCheck();
}

const GDESC='route-planner-sync', GFILE='route-planner.json';
async function gh(path,opt={}){

  if(r.status===404) throw new Error('Gist not found (404).');

}
let syncing=false;

      if(g) SYNC.gistId=g.id; else { const c=await gh('/gists',{method:'POST',body:JSON.stringify({description:GDESC,public:false,files:{[GFILE]:{content:JSON.stringify(S)}}})}); SYNC.gistId=c.id; }
    }

    if(f){ let txt=f.content; if(f.truncated){txt=await (await fetch(f.raw_url,{cache:'no-store'})).text();} let R=null; try{R=JSON.parse(txt);}catch(e){} if(merge(R)){save(true); rerender();} }
    await gh('/gists/'+SYNC.gistId,{method:'PATCH',body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(S)}}})});

}

function verdictHTML(){
  const c=S.checkins.filter(x=>!x.del).sort((a,b)=>a.date<b.date?-1:1); if(!c.length) return '';
  const last=c[c.length-1],prev=c[c.length-2],prev2=c[c.length-3]; const out=[];
  if(last.sleep>=3) out.push(['w','Sleep first: three or more short nights. No food changes this week; lights-out at 23:30 for seven days.']);
  if(prev){const drop=prev.weight-last.weight;
    if(c.length>2&&drop>0.7) out.push(['w','Dropping faster than 0.7 kg a week. Add the carb back at one meal.']);
    else if(prev2&&Math.abs(prev.weight-last.weight)<=0.1&&Math.abs(prev2.weight-prev.weight)<=0.1&&last.sleep<3) out.push(['w','Flat two weeks with sleep in place: remove one roti or half the rice from one carb meal.']);
    else if(drop>=0.1) out.push(['ok','On the line. Change nothing.']);
    else if(last.sleep<3) out.push(['ok','Flat or up for one week only. Ignore it; only two-week trends change anything.']);
  } else out.push(['ok','Baseline saved. Nothing to decide yet.']);
  const a=weekAuto(last.date), b=prev?weekAuto(prev.date):null;

  if(b&&a.pitches===0&&b.pitches===0) out.push(['w','No pitches two weeks running: record 2 minutes on the phone during the incline walk.']);
  return out.map(o=>`<div class="verdict ${o[0]==='ok'?'ok':''}">${o[1]}</div>`).join('');
}

ay check-in. Follow it; nothing else changes.'],['Sync','Copies your ticks and logs to a private GitHub Gist so your phone and laptop match.']];

/* ---------- SETTINGS ---------- */
function vSettings(){
  const s=S.setup;
  return `<div class="top"><div><h1>Settings</h1></div></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>Sync between phone and laptop</h3><span id="syncState">${syncStateHTML()}</span></div>
   <p class="sm muted" style="margin-top:6px">Your data is saved in a private GitHub Gist that only your token can open. Paste the same token on both devices; the app saves and loads automatically.</p>
   <details style="margin-top:10px"><summary class="sm" style="cursor:pointer;color:var(--accent);font-weight:600">How to make the token (2 minutes, once)</summary><ol class="steps sm"><li>On GitHub: your photo → <b>Settings</b> → <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Tokens (classic)</b> → <b>Generate new token (classic)</b>.</li><li>Note: “Route planner sync”. Expiration: <b>90 days</b> or a custom date after 31 May 2027.</li><li>Tick <b>only</b> the <span class="kbd">gist</span> box. Nothing else. Generate, then copy the token (starts with <span class="kbd">ghp_</span>).</li><li>Paste it below on this device, tap <b>Save & sync</b>. Then do the same on your other device.</li></ol><p class="xs faint">The token can only read and write your gists, not your code. It stays on your devices; it is never put into the synced data. If you think it leaked, delete it on GitHub and make a new one.</p></details>
   ${fld('tok','GitHub token','A <b>classic</b> personal access token with only the <b>gist</b> permission. Starts with <b>ghp_</b>. See “How to make the token” above.',`<input id="tok" class="in" type="password" autocomplete="off" placeholder="ghp_…" value="${esc(SYNC.token)}">`)}
   <div class="btnrow"><button class="btn primary" id="tokSave">${I.sync}Save & sync</button><button class="btn" id="syncBtn">Sync now</button>${SYNC.token?'<button class="btn" id="tokOff">Turn sync off</button>':''}</div>
   <p class="xs faint" style="margin-top:8px">Sync works on your GitHub Pages site. It can’t run inside the claude.ai preview, which blocks outside connections.</p></div>
  <div class="card"><h3>Personal</h3><div class="frow">
   ${fld('np','Notice period (days)','How many days you must keep working at <b>your current job (AIONOS)</b> after you resign. It’s in your <b>appointment letter</b> or the HR policy/portal — <b>not</b> in a new offer. Common values: <b>30, 60 or 90</b>. Leave empty until you find it (task on 24 Nov).',`<input id="np" class="in" inputmode="numeric" placeholder="e.g. 60" value="${esc(s.noticeDays)}">`)}
   ${fld('fm','This week’s free meal','The one meal this week where you eat anything. Choose it on Sunday. <b>Example: Saturday dinner — chole bhature</b>',`<input id="fm" class="in" placeholder="e.g. Sat dinner" value="${esc(s.freeMeal)}">`)}
   ${fld('au','Treadmill-only audio','A podcast, series or album you only allow yourself during the incline walk. Pairing makes the walk something you want to do. <b>Example: a cricket podcast</b>',`<input id="au" class="in" placeholder="e.g. podcast name" value="${esc(s.audio)}">`)}
  </div><div class="btnrow"><button class="btn primary" id="setSave">Save</button></div>
  ${s.noticeDays?`<p class="sm muted" style="margin-top:10px">With ${esc(s.noticeDays)} days of notice, to join a new job by 31 May you should resign by <b>${fmt(addDays('2027-05-31',-(+s.noticeDays||0)))}</b> — so the offer must be signed before then.</p>`:''}</div>
  <div class="card"><h3>Appearance</h3><div class="btnrow"><button class="btn sm" data-theme="auto">System</button><button class="btn sm" data-theme="light">Light</button><button class="btn sm" data-theme="dark">Dark</button></div></div>
  <div class="card"><h3>Backup</h3><p class="sm muted" style="margin-top:4px">Sync already backs everything up. This is a manual copy, in case you want one.</p><div class="btnrow"><button class="btn" id="bkCopy">${I.copy}Copy backup</button><button class="btn" id="bkPaste">Restore from pasted backup</button><button class="btn" id="bkReset">Erase all data on this device</button></div><textarea id="bk" class="in" style="margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;display:none" placeholder="Paste a backup here, then tap Restore again"></textarea></div>`;
}

/* =================== WIRING =================== */
function wire(m){
  m.querySelectorAll('table').forEach(t=>{const hs=[...t.querySelectorAll('tr:first-child th')].map(th=>th.textContent.trim());if(!hs.length)return;t.classList.add('stack');t.querySelectorAll('tr').forEach(tr=>[...tr.children].forEach((c,i)=>{if(c.tagName==='TD')c.setAttribute('data-label',hs[i]||'');}));});
  m.querySelectorAll('.task [data-act]').forEach(b=>b.onclick=()=>{const id=b.closest('.task').dataset.id, cur=st(id), act=b.dataset.act;
    if(act==='done'){setSt(id,cur==='done'?'':'done'); if(cur!=='done') toast('Done ✓');} else {setSt(id,cur==='skip'?'':'skip'); if(cur!=='skip') toast('Skipped');} rerender();});
  m.querySelectorAll('.hint').forEach(b=>b.onclick=()=>{const h=document.getElementById('h_'+b.dataset.h);const o=h.hidden;h.hidden=!o;b.setAttribute('aria-expanded',String(o));});
  m.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const v=b.dataset.nav;VD=v==='today'?TODAY():clampDate(addDays(VD,+v));render('today',true);});
  m.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{const v=+b.dataset.wk;VW=v===0?weekMon(TODAY()):addDays(VW,v);render('week',true);});
  m.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{VM=b.dataset.mo;render('month',true);});
  m.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{VD=b.dataset.day;if(location.hash==='#today')render('today');else location.hash='#today';});
  m.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{VP=+b.dataset.ph;render('phases',true);});
  m.querySelectorAll('[data-week]').forEach(b=>{const go=()=>{VW=b.dataset.week;location.hash='#week';};b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{VD=TODAY();location.hash='#'+b.dataset.go;});
  m.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll).scrollIntoView({behavior:'smooth'}));
  const co=m.querySelector('[data-closeold]'); if(co) co.onclick=()=>{const w=weekMon(TODAY());const L=pastDueAll().filter(t=>t.date<w);if(!L.length){toast('Nothing older than this week');return;} if(!confirm(`Mark ${L.length} tasks from before this week as skipped? This is the Monday fresh start.`))return; const now=Date.now(); L.forEach(t=>S.status[t.id]={s:'skip',u:now}); save(); rerender(); toast('Older tasks closed');};
  m.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{LOGSUB=b.dataset.sub;render('log',true);});
  m.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(SCRIPTS[+b.dataset.copy].t));
  const rq=m.querySelector('#rq'); if(rq) rq.oninput=()=>{LIBQ=rq.value;m.querySelector('#rlist').innerHTML=protocolsHTML(rq.value);};
  const ci=m.querySelector('#ciSave'); if(ci) ci.onclick=()=>{const w=parseFloat(m.querySelector('#ciW').value);if(!(w>30&&w<200)){toast('Enter your weight in kg, e.g. 75.6');m.querySelector('#ciW').focus();return;}
    const date=m.querySelector('#ciD').value||TODAY(); const ex=S.checkins.find(c=>c.date===date&&!c.del);
    const rec={id:ex?ex.id:uid(),date,weight:+w.toFixed(1),sleep:Math.max(0,Math.min(7,+m.querySelector('#ciS').value||0)),note:m.querySelector('#ciN').value.trim(),u:Date.now()};
    S.checkins=S.checkins.filter(c=>c.id!==rec.id).concat(rec); save(); toast('Check-in saved'); rerender();};
  const cc=m.querySelector('#ciCopy'); if(cc) cc.onclick=()=>{const td=TODAY(),a=weekAuto(td);const w=m.querySelector('#ciW').value||(S.checkins.filter(c=>!c.del).sort((x,y)=>x.date<y.date?-1:1).pop()||{}).weight||'—';
    copyText(`Week of ${fmt(weekMon(td))}: tasks ${a.tasks.done}/${a.tasks.total} · problems ${a.problems} · pitches ${a.pitches} · applications ${a.apps} · scale ${w} · short nights ${m.querySelector('#ciS').value||0} · past due ${pastDueAll().length}`+(m.querySelector('#ciN').value.trim()?`\nNote: ${m.querySelector('#ciN').value.trim()}`:''));};
  m.querySelectorAll('[data-delci]').forEach(b=>b.onclick=()=>{const c=S.checkins.find(x=>x.id===b.dataset.delci);if(c){c.del=true;c.u=Date.now();save();rerender();}});
  const as=m.querySelector('#aSave'); if(as) as.onclick=()=>{const c=m.querySelector('#aC').value.trim();if(!c){toast('Company name is needed');m.querySelector('#aC').focus();return;}
    S.apps.push({id:uid(),company:c,role:m.querySelector('#aR').value.trim(),channel:m.querySelector('#aCh').value,date:m.querySelector('#aD').value||TODAY(),contact:m.querySelector('#aCt').value.trim(),next:m.querySelector('#aN').value.trim(),stage:'Applied',u:Date.now()});save();toast('Application added');rerender();};
  m.querySelectorAll('[data-stage]').forEach(sl=>sl.onchange=()=>{const a=S.apps.find(x=>x.id===sl.dataset.stage);if(a){a.stage=sl.value;a.u=Date.now();save();rerender();}});
  m.querySelectorAll('[data-delapp]').forEach(b=>b.onclick=()=>{const a=S.apps.find(x=>x.id===b.dataset.delapp);if(a&&confirm('Delete this application?')){a.del=true;a.u=Date.now();save();rerender();}});
  const ls=m.querySelector('#lSave'); if(ls) ls.onclick=()=>{const w=+m.querySelector('#lW').value,r=+m.querySelector('#lR').value;if(!(w>0&&r>0)){toast('Enter weight and reps');return;}
    S.lifts.push({id:uid(),date:m.querySelector('#lD').value||TODAY(),lift:m.querySelector('#lL').value,w,r,u:Date.now()});save();toast('Top set logged');rerender();};
  m.querySelectorAll('[data-dellift]').forEach(b=>b.onclick=()=>{const l=S.lifts.find(x=>x.id===b.dataset.dellift);if(l){l.del=true;l.u=Date.now();save();rerender();}});
  const ts=m.querySelector('#tokSave'); if(ts) ts.onclick=()=>{const v=m.querySelector('#tok').value.trim();if(!v){toast('Paste the token first');return;} if(v!==SYNC.token){SYNC.gistId='';} SYNC.token=v;saveSync();setSyncState('idle','Ready');syncNow(false).then(()=>rerender());};
  const sb=m.querySelector('#syncBtn'); if(sb) sb.onclick=()=>{if(!SYNC.token){toast('Add a token first');return;} syncNow(false);};
  const to=m.querySelector('#tokOff'); if(to) to.onclick=()=>{if(!confirm('Turn sync off on this device? Your data stays here and in the gist.'))return;SYNC.token='';SYNC.gistId='';saveSync();setSyncState('off','');rerender();};
  const ss=m.querySelector('#setSave'); if(ss) ss.onclick=()=>{S.setup={noticeDays:m.querySelector('#np').value.trim(),freeMeal:m.querySelector('#fm').value.trim(),audio:m.querySelector('#au').value.trim(),u:Date.now()};save();toast('Saved');rerender();};
  m.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{const v=b.dataset.theme;if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);try{localStorage.setItem(KEY+'-theme',v);}catch(e){}});
  const bc=m.querySelector('#bkCopy'); if(bc) bc.onclick=()=>copyText(JSON.stringify(S));
  const bp=m.querySelector('#bkPaste'); if(bp) bp.onclick=()=>{const ta=m.querySelector('#bk');if(ta.style.display==='none'){ta.style.display='block';ta.focus();return;}try{const o=JSON.parse(ta.value);if(!o||!o.status)throw 0;merge(o);save();toast('Restored and merged');rerender();}catch(e){toast('That isn’t a valid backup');}};
  const br=m.querySelector('#bkReset'); if(br) br.onclick=()=>{if(confirm('Erase all planner data on THIS device? (Synced data in the gist is not deleted.)')){S=DEF();save(true);rerender();}};
}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>fb(t));}else fb(t);function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied');}catch(e){toast('Select and copy manually');}a.remove();}}

/* =================== BOOT =================== */
load(); gen();
try{const th=localStorage.getItem(KEY+'-theme');if(th&&th!=='auto')document.documentElement.setAttribute('data-theme',th);}catch(e){}
LASTDAY=TODAY(); VD=TODAY();
route(); setSyncState(SYNC.token?'idle':'off',SYNC.token?'Ready':'');
fetchTime();
if(SYNC.token) syncNow(true);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){fetchTime(); if(SYNC.token) syncNow(true);}});
setInterval(()=>{if(TODAY()!==LASTDAY) afterDayCheck();},60000);
</script>
</body>
</html>
